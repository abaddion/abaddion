<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="abaddion — creative technologist">
    <meta name="build" content="__BUILD_SHA__">
    <title>abaddion</title>
    <link rel="preload" href="/content.json" as="fetch" crossorigin>
    <link rel="preload" href="fonts/label-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="js/bootstrap.js">
    <link rel="modulepreload" href="js/modules/utils.js">
    <link rel="modulepreload" href="js/modules/content-loader.js">
    <link rel="modulepreload" href="js/modules/card-layer.js">
    <link rel="modulepreload" href="js/modules/rail.js">
    <link rel="modulepreload" href="js/modules/router.js">
    <link rel="stylesheet" href="css/main.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/build/three.module.min.js",
            "three/addons/": "./vendor/three/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <a class="skip-link" href="#cards">Skip to content</a>

    <header id="identity-hero" class="identity-hero">
        <h1 class="identity-name">abaddion</h1>
        <p class="identity-headline">creative technologist</p>
        <p class="identity-intro">PLACEHOLDER: code, math, canvas.</p>
    </header>

    <canvas id="glitch-canvas" aria-hidden="true"></canvas>

    <nav id="floor-rail" aria-label="Floors">
        <ul class="floor-rail-list">
            <li><a href="/" aria-current="page">abaddion</a></li>
            <li><a href="/canvas">canvas</a></li>
            <li><a href="/code">code</a></li>
            <li><a href="/career-pages">career pages</a></li>
            <li><a href="/about">about</a></li>
        </ul>
    </nav>
    <div id="floor-labels" aria-hidden="true"></div>

    <p id="open-hint" class="open-hint" aria-hidden="true"><span class="hint-fine">click to open</span><span class="hint-coarse">tap to open</span></p>

    <div id="cards" class="cards-root"></div>

    <div id="hud">
        <div class="info-line">
            <span class="label">PASS</span>
            <span class="value" id="pass-count">00</span>
        </div>
        <div class="info-line">
            <span class="label">FPS</span>
            <span class="value" id="fps-counter">60</span>
        </div>
        <div class="info-line">
            <span class="label">GYRO</span>
            <span class="value" id="gyro-status" role="button" tabindex="0">TAP_TO_ENABLE</span>
        </div>
    </div>

    <div id="loading" class="hidden" aria-hidden="true">
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <p class="loading-text">INITIALIZING</p>
    </div>

    <div id="cursor">
        <div class="cursor-core"></div>
        <div class="cursor-trail"></div>
    </div>

    <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
